# マガジン記事のPRで、AI臭さ・出典・写真・SEOを自動チェックする
name: Magazine check

on:
  pull_request:
    paths: ['src/**', 'magazine/**', 'scripts/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:articles
      - run: npm run build
      - run: npm run check:seo
